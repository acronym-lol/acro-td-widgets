# yaml-language-server: $schema=https://docs.acronym.lol/schemas/meta.schema.json
#
# Repo metadata for acro-docs, which aggregates this docs/ folder into the internal
# documentation site and publishes a catalog.json from these fields.
#
# Plain YAML with no dependency on any generator. The comment above gives editors live
# schema validation and is inert in every tool that does not understand it.

schema_version: 1
repo: acronym-lol/acro-td-widgets

name: Acro TD Widgets
summary: 'Widget framework for building custom in-TD UIs from a reusable library of primitives, with a container primitive and component browser.'

owner: '@matthewwachter'
maintainers: ['@matthewwachter']

tier: 2
status: active

# `public` = name, summary, category, status and links are published on the public
# acronym.lol tools page, once acro-docs' public-allowlist.yml also lists this repo.
# `internal` would keep it inside acro-docs only.
visibility: public

category: touchdesigner

# Second level of the acro-docs sidebar, within `category`. One of the seven modules
# bundled into acro-td-core as a git subtree.
group: modules

requires:
  - TouchDesigner

links:
  # The public Docsify site on GitHub Pages.
  homepage: https://acronym-lol.github.io/acro-td-widgets/
